[project]
name = "meshkit"
version = "0.1.0"
description = "Convert and verify the meshes of the robot descriptions in the kinema catalog."
readme = "README.md"
# Must match the Python inside Blender 5.2 LTS (3.13). The Blender-side job loads
# pycollada from this environment, so an ABI mismatch here would surface there.
requires-python = "==3.13.*"
# The vendored COLLADA importer is kinema's, which is GPL-3.0-or-later.
license = "GPL-3.0-or-later"
authors = [{ name = "Eugenio Bernardi" }]
dependencies = [
    "numpy",
    "pycollada",   # read .dae inside Blender: Blender 5.0 removed its own importer
    "pyyaml",      # mesh paths that live in YAML config (Universal Robots)
    "trimesh",     # independent second opinion on every GLB; no [easy] extras
    "xacrodoc",    # evaluate xacro without ROS -- the same engine kinema uses
]

[project.scripts]
meshkit = "meshkit.cli:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/meshkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "blender: needs a real Blender 5.2+ (KINEMA_BLENDER or auto-discovery); skipped otherwise",
]
